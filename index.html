<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LuminFin</title>
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LuminFin">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c12;--bg2:#0f1118;--bg3:#161922;--bg4:#1e2230;
  --gold:#e8a020;--gold2:#f5c05a;--gold-dim:rgba(232,160,32,0.1);
  --text:#f0ece0;--text2:#9a9585;--muted:#555a6b;
  --border:rgba(255,255,255,0.07);--border2:rgba(232,160,32,0.25);
  --danger:#e05252;--success:#3db87a;--green-dim:rgba(61,184,122,0.12);
  --radius:10px;--radius-lg:16px;--radius-xl:20px;--card:#111420;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--text)}
#root{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--bg);position:relative}
.mono{font-family:'Space Mono',monospace}
.up{color:var(--success)}.dn{color:var(--danger)}
 
/* ── ONBOARDING ── */
#ob{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-top)+36px) 24px calc(var(--safe-bottom)+20px);max-width:430px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
.ob-logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--text2);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 6px var(--gold)}50%{box-shadow:0 0 16px var(--gold),0 0 28px rgba(232,160,32,.3)}}
.ob-tag{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;line-height:1.6}
.ob-pbar{width:100%;margin-bottom:22px}
.ob-pbar-bg{height:2px;background:var(--bg4);border-radius:2px;position:relative;overflow:hidden}
.ob-pbar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:2px;transition:width .4s ease}
.ob-card{width:100%;background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-xl);padding:24px 22px;display:flex;flex-direction:column;gap:18px;flex:1;max-height:620px;overflow-y:auto}
.ob-card::-webkit-scrollbar{display:none}
.ob-step{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.ob-title{font-size:20px;font-weight:600;line-height:1.3}
.fgroup{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.flbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text2)}
.finput{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:12px 14px;outline:none;transition:border-color .2s}
.finput:focus{border-color:var(--gold)}.finput::placeholder{color:var(--muted)}
.risk-num{font-family:'Space Mono',monospace;font-size:36px;font-weight:700;color:var(--gold);text-align:center}
.risk-lbl{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--gold) var(--pct,50%),var(--bg4) var(--pct,50%));margin:14px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);cursor:pointer}
.slider-ends{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
.kopts{display:flex;flex-direction:column;gap:9px}
.kopt{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .2s,background .2s}
.kopt.sel{border-color:var(--gold);background:var(--gold-dim)}
.krad{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.kopt.sel .krad{border-color:var(--gold);background:var(--gold)}
.kopt.sel .krad::after{content:'';width:6px;height:6px;background:var(--bg);border-radius:50%;display:block}
.kt{font-size:13px;font-weight:500}.kd{font-size:11px;color:var(--text2);margin-top:2px}
.amt-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.amt-chip{background:var(--bg3);border:0.5px solid var(--border);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;transition:border-color .2s,background .2s}
.amt-chip.sel{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:border-color .2s,background .2s}
.sec-card.sel{border-color:var(--gold);background:var(--gold-dim)}
.sec-emo{font-size:20px;margin-bottom:5px}.sec-name{font-size:12px;font-weight:600}.sec-desc{font-size:10px;color:var(--text2);margin-top:2px}
.ob-btn{width:100%;background:var(--gold);color:#0a0c12;border:none;border-radius:var(--radius);padding:13px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:auto}
.ob-btn:active{transform:scale(.98)}.ob-btn:disabled{opacity:.3;cursor:not-allowed}
 
/* ── APP ── */
#app{display:none;flex:1;flex-direction:column;height:100%;overflow:hidden}
.appbar{padding:calc(var(--safe-top)+12px) 16px 11px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0}
.appbar-logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;color:var(--gold);display:flex;align-items:center;gap:7px}
.appbar-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:glow 2s infinite}
.appbar-right{display:flex;align-items:center;gap:9px}
.kse-pill{font-family:'Space Mono',monospace;font-size:9px;padding:4px 9px;border-radius:20px;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;gap:5px}
.av-btn{width:29px;height:29px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);cursor:pointer;flex-shrink:0}
#screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;padding-bottom:72px}
.screen.active{display:block}
.screen::-webkit-scrollbar{display:none}
.botnav{flex-shrink:0;display:flex;background:var(--bg2);border-top:0.5px solid var(--border);padding:7px 0 calc(7px + var(--safe-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:5px 0}
.nav-btn svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.nav-btn span{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.5px;transition:color .2s}
.nav-btn.active svg{stroke:var(--gold)}.nav-btn.active span{color:var(--gold)}
 
/* SHARED */
.sh{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}
.sec-more{font-size:11px;color:var(--muted);cursor:pointer}
.shimmer{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:6px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
 
/* INDEX BAR */
.index-bar{padding:14px 16px;background:linear-gradient(160deg,var(--bg2),var(--bg));border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.index-left .idx-name{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:3px}
.index-left .idx-val{font-family:'Space Mono',monospace;font-size:22px;font-weight:700}
.index-right{text-align:right}
.index-right .idx-chg{font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
.index-right .idx-pct{font-family:'Space Mono',monospace;font-size:11px;margin-top:2px}
 
/* PORTFOLIO */
.pf-card{margin:14px 16px;background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.pf-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.pf-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--gold);margin-bottom:6px}
.pf-value{font-family:'Space Mono',monospace;font-size:26px;font-weight:700}
.pf-change{font-family:'Space Mono',monospace;font-size:12px;margin-top:4px}
.pf-badge{font-family:'Space Mono',monospace;font-size:9px;padding:4px 9px;border-radius:20px;background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2);letter-spacing:.5px}
.pie-wrap{display:flex;align-items:center;gap:16px;margin:14px 0}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:7px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11px}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.legend-name{flex:1;color:var(--text2)}
.legend-pct{font-family:'Space Mono',monospace;font-weight:700}
.holdings-table{margin-top:8px}
.holding-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:0.5px solid var(--border)}
.holding-left{display:flex;align-items:center;gap:10px}
.holding-icon{width:32px;height:32px;border-radius:8px;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.holding-ticker{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.holding-name{font-size:10px;color:var(--muted);margin-top:1px}
.holding-right{text-align:right}
.holding-alloc{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.holding-amt{font-size:10px;color:var(--text2);margin-top:1px}
.pf-actions{display:flex;gap:8px;margin-top:14px}
.pf-action-btn{flex:1;border:0.5px solid var(--border);background:var(--bg3);color:var(--text);border-radius:var(--radius);padding:11px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .2s;text-align:center}
.pf-action-btn:active{border-color:var(--gold)}
.pf-action-btn.primary{background:var(--gold-dim);color:var(--gold);border-color:var(--border2)}
.pf-building{text-align:center;padding:30px 16px}
.pf-building .mono{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:14px}
.spinner{width:36px;height:36px;border:2px solid var(--bg4);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
 
/* MARKET BOARDS */
.board-tabs{display:flex;padding:12px 16px 0;gap:0;border-bottom:0.5px solid var(--border);overflow-x:auto}
.board-tabs::-webkit-scrollbar{display:none}
.board-tab{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;letter-spacing:.5px;white-space:nowrap}
.board-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.mkt-list{display:flex;flex-direction:column}
.mkt-row{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.mkt-row:active{background:var(--bg2)}
.mkt-left{display:flex;align-items:center;gap:11px}
.mkt-icon{width:35px;height:35px;border-radius:9px;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-family:'Space Mono',monospace;font-weight:700;color:var(--gold)}
.mkt-ticker{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.mkt-name{font-size:10px;color:var(--muted);margin-top:2px}
.mkt-right{text-align:right}
.mkt-price{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.mkt-chg{font-family:'Space Mono',monospace;font-size:10px;margin-top:2px}
.mkt-vol{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px}
 
/* IMPACT / SUGGESTIONS */
.impact-card{margin:0 16px 12px;background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;gap:11px}
.impact-icon{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.impact-icon.pos{background:var(--green-dim);border:0.5px solid var(--success)}
.impact-icon.neg{background:rgba(224,82,82,0.1);border:0.5px solid var(--danger)}
.impact-body{flex:1}
.impact-title{font-size:12px;font-weight:600;margin-bottom:4px}
.impact-text{font-size:11px;color:var(--text2);line-height:1.5}
.sugg-card{margin:0 16px 10px;background:var(--card);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:border-color .2s}
.sugg-card:active{border-color:var(--gold)}
.sugg-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--gold);margin-bottom:6px}
.sugg-text{font-size:12px;color:var(--text);line-height:1.5}
 
/* STOCK DETAIL MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:22px 22px calc(22px + var(--safe-bottom));border-top:0.5px solid var(--border);max-height:85vh;overflow-y:auto}
.modal-box::-webkit-scrollbar{display:none}
.modal-handle{width:32px;height:2px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.country-opt{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px;cursor:pointer;transition:border-color .2s,background .2s;text-align:center}
.country-opt:active{border-color:var(--gold);background:var(--gold-dim)}
.country-flag{font-size:22px;margin-bottom:5px}
.country-name{font-size:12px;font-weight:600}
.country-close{width:100%;background:transparent;border:0.5px solid var(--border);border-radius:var(--radius);padding:11px;font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);cursor:pointer}
 
/* CUSTOMIZE MODAL */
.cust-input{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:12px 14px;outline:none;resize:none;min-height:80px;line-height:1.5;margin-bottom:12px}
.cust-input:focus{border-color:var(--gold)}.cust-input::placeholder{color:var(--muted)}
 
/* NEWS */
.news-list{display:flex;flex-direction:column}
.ncard{padding:14px 16px;border-bottom:0.5px solid var(--border);display:flex;gap:11px;cursor:pointer;transition:background .15s}
.ncard:active{background:var(--bg2)}
.nbody{flex:1}
.nsource{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.ntitle{font-size:13px;font-weight:500;line-height:1.5;margin-bottom:5px}
.nmeta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ntag{font-family:'Space Mono',monospace;font-size:9px;border:0.5px solid var(--border2);color:var(--text2);padding:2px 6px;border-radius:10px}
.nthumb{width:54px;height:54px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
 
/* CHAT */
.chat-shell{display:flex;flex-direction:column;height:100%}
.chat-top{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg)}
.chat-av{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);flex-shrink:0}
.chat-name{font-size:13px;font-weight:600}
.chat-status{font-family:'Space Mono',monospace;font-size:9px;color:var(--success);display:flex;align-items:center;gap:4px;margin-top:2px}
.chat-sdot{width:4px;height:4px;border-radius:50%;background:var(--success)}
.msgs{flex:1;overflow-y:auto;padding:13px 14px;display:flex;flex-direction:column;gap:11px}
.msgs::-webkit-scrollbar{display:none}
.msg{display:flex;gap:7px}.msg.user{flex-direction:row-reverse}
.mbub{max-width:82%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.65}
.msg.assistant .mbub{background:var(--card);border:0.5px solid var(--border);border-bottom-left-radius:3px}
.msg.user .mbub{background:var(--gold);color:#0a0c12;border-bottom-right-radius:3px;font-weight:500}
.mav{width:25px;height:25px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Space Mono',monospace;margin-top:2px}
.msg.assistant .mav{background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2)}
.msg.user .mav{background:var(--bg3);color:var(--text);border:0.5px solid var(--border)}
.typing{display:flex;align-items:center;gap:4px;padding:10px 13px;background:var(--card);border:0.5px solid var(--border);border-radius:15px;border-bottom-left-radius:3px;width:fit-content}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite;opacity:.4}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.sugs{padding:7px 13px;display:flex;gap:7px;overflow-x:auto;flex-shrink:0}
.sugs::-webkit-scrollbar{display:none}
.sug{background:var(--bg3);border:0.5px solid var(--border);border-radius:20px;padding:6px 11px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .2s}
.sug:active{border-color:var(--gold);color:var(--gold)}
.chat-in-row{padding:9px 13px calc(9px + var(--safe-bottom));display:flex;gap:8px;align-items:flex-end;border-top:0.5px solid var(--border);background:var(--bg);flex-shrink:0}
.cin{flex:1;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:none;max-height:86px;line-height:1.5;transition:border-color .2s}
.cin:focus{border-color:var(--gold)}.cin::placeholder{color:var(--muted)}
.sendbtn{width:36px;height:36px;border-radius:9px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s,transform .1s}
.sendbtn:active{transform:scale(.92)}.sendbtn:disabled{opacity:.3;cursor:not-allowed}
.sendbtn svg{width:13px;height:13px}
.news-summary-card{background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.news-summary-source{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1px;margin-bottom:5px}
.news-summary-title{font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.4}
.news-portfolio-btn{width:100%;background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2);border-radius:8px;padding:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
 
/* PROFILE */
.prof-hero{padding:24px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;border-bottom:0.5px solid var(--border)}
.prof-av{width:68px;height:68px;border-radius:50%;background:var(--gold-dim);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:20px;color:var(--gold)}
.prof-name{font-size:20px;font-weight:600}
.prof-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.ptag{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);border:0.5px solid var(--border2);padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.prof-rows{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.prow{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.prow-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:3px}
.prow-val{font-size:13px;font-weight:500}
.prof-secs{padding:0 16px 18px}
.prof-secs-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1.5px;margin-bottom:9px}
.prof-chips{display:flex;flex-wrap:wrap;gap:7px}
.pchip{font-size:12px;background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2);padding:4px 11px;border-radius:20px}
</style>

/* ── ONBOARDING ── */
const STEPS=['Your details','Your occupation','Which field are you in?','Which markets to invest in?','Risk appetite','Finance knowledge','Investment amount','Your interests'];
const TOTAL=8;
 
function renderOB(){
  document.getElementById('ob-fill').style.width=((S.step+1)/TOTAL*100)+'%';
  document.getElementById('ob-card').innerHTML=`<div class="ob-step">STEP ${S.step+1} OF ${TOTAL}</div><div class="ob-title">${STEPS[S.step]}</div>${[s0,s1,sDomain,sMarket,s2,s3,s4,s5][S.step]()}`;
  if(S.step===4){const r=document.getElementById('fr');if(r)r.addEventListener('input',function(){const v=parseInt(this.value);S.P.risk=v;this.style.setProperty('--pct',v+'%');const d=document.getElementById('rv'),l=document.getElementById('rl');if(d)d.textContent=v;if(l)l.textContent=RL(v);});}
}
function s0(){return`<div style="font-size:13px;color:var(--text2);margin-bottom:4px;">Welcome, ${S.P.name.split(' ')[0]}! Just a few quick questions.</div><div class="field"><div class="flbl">Your age</div><input class="finput" id="fa" type="number" placeholder="e.g. 25" min="13" max="100" value="${S.P.age}"/></div><button class="ob-btn" onclick="obNext()">Continue →</button>`;}
function s1(){return`<div class="field"><div class="flbl">Occupation</div><input class="finput" id="fo" type="text" placeholder="e.g. Engineer, Business Owner" value="${S.P.occupation}"/></div><button class="ob-btn" onclick="obNext()">Continue →</button>`;}
function sDomain(){return`<div style="font-size:13px;color:var(--text2);margin-bottom:4px;">We'll suggest stocks relevant to your field.</div><div class="sec-grid" id="domain-grid" style="overflow-y:auto;flex:1;">${DOMAINS.map(d=>`<div class="sec-card ${S.P.domain===d.id?'sel':''}" data-id="${d.id}" onclick="selDomain('${d.id}')"><div class="sec-emo" style="pointer-events:none;">${d.emoji}</div><div class="sec-name" style="pointer-events:none;">${d.name}</div></div>`).join('')}</div><button class="ob-btn" id="dbtn" onclick="obNext()" ${!S.P.domain?'disabled':''}>Continue →</button>`;}
function sMarket(){return`<div style="font-size:13px;color:var(--text2);margin-bottom:4px;">Pick one or more markets you want to invest in. Tap to select multiple.</div><div class="sec-grid" id="market-grid" style="overflow-y:auto;flex:1;">${MARKETS_LIST.map(m=>`<div class="sec-card ${S.P.markets.includes(m.id)?'sel':''}" data-id="${m.id}" onclick="toggleMarket('${m.id}')"><div class="sec-emo" style="pointer-events:none;">${m.emoji}</div><div class="sec-name" style="pointer-events:none;">${m.name}</div></div>`).join('')}</div><button class="ob-btn" id="mbtn" onclick="obNext()" ${S.P.markets.length===0?'disabled':''}>Continue →</button>`;}
function s2(){return`<div style="text-align:center;padding:6px 0"><div class="risk-num" id="rv">${S.P.risk}</div><div class="risk-lbl" id="rl">${RL(S.P.risk)}</div></div><input type="range" id="fr" min="0" max="100" step="1" value="${S.P.risk}" style="--pct:${S.P.risk}%"/><div class="slider-ends"><span>SAFE</span><span>AGGRESSIVE</span></div><button class="ob-btn" onclick="obNext()">Continue →</button>`;}
function s3(){return`<div class="kopts">${KO.map(k=>`<div class="kopt ${S.P.knowledge===k.id?'sel':''}" onclick="selK('${k.id}')"><div class="krad"></div><div><div class="kt">${k.title}</div><div class="kd">${k.desc}</div></div></div>`).join('')}</div><button class="ob-btn" id="kbtn" onclick="obNext()" ${!S.P.knowledge?'disabled':''}>Continue →</button>`;}
function s4(){return`<div><div class="flbl" style="margin-bottom:10px;">How much do you want to invest?</div><div class="amt-chips">${AMOUNTS.map(a=>`<div class="amt-chip ${S.P.amount===a?'sel':''}" onclick="selAmt('${a}')">${a}</div>`).join('')}</div></div><button class="ob-btn" id="abtn" onclick="obNext()" ${!S.P.amount?'disabled':''}>Continue →</button>`;}
function s5(){return`<div class="sec-grid" id="sector-grid" style="overflow-y:auto;flex:1;">${SECTORS.map(s=>`<div class="sec-card ${S.P.sectors.includes(s.id)?'sel':''}" data-id="${s.id}" onclick="toggleSec('${s.id}')"><div class="sec-emo" style="pointer-events:none;">${s.emoji}</div><div class="sec-name" style="pointer-events:none;">${s.name}</div><div class="sec-desc" style="pointer-events:none;">${s.desc}</div></div>`).join('')}</div><button class="ob-btn" id="lbtn" onclick="launch()" ${S.P.sectors.length===0?'disabled':''}>Build My Portfolio →</button>`;}
 
function obNext(){
  if(S.step===0){const a=document.getElementById('fa')?.value.trim();if(!a||isNaN(a)||a<13)return;S.P.age=a;}
  else if(S.step===1){const o=document.getElementById('fo')?.value.trim();if(!o)return;S.P.occupation=o;}
  else if(S.step===2){if(!S.P.domain)return;}
  else if(S.step===3){if(S.P.markets.length===0)return;}
  else if(S.step===4){S.P.risk=parseInt(document.getElementById('fr')?.value||50);}
  else if(S.step===5){if(!S.P.knowledge)return;}
  else if(S.step===6){if(!S.P.amount)return;}
  S.step++;renderOB();
}
function selDomain(id){
  S.P.domain=id;
  document.querySelectorAll('#domain-grid .sec-card').forEach(el=>el.classList.toggle('sel',el.getAttribute('data-id')===id));
  const b=document.getElementById('dbtn');if(b)b.disabled=false;
}
function toggleMarket(id){

// Robustly pull a JSON object out of an LLM response that may contain extra text
function extractJSON(txt){
  if(!txt)return null;
  txt=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
  // Try direct parse first
  try{return JSON.parse(txt);}catch(e){}
  // Otherwise grab the substring between the first { and last }
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  if(a>-1&&b>a){
    let slice=txt.slice(a,b+1);
    try{return JSON.parse(slice);}catch(e){}
    // Remove trailing commas which break parse
    try{return JSON.parse(slice.replace(/,(\s*[}\]])/g,'$1'));}catch(e){}
  }
  return null;
}

function calcAmount(alloc){
  const map={'PKR 50K':50000,'PKR 100K':100000,'PKR 500K':500000,'PKR 1M':1000000,'PKR 5M':5000000,'PKR 10M+':10000000};

  if(val>=1000)return'PKR '+(val/1000).toFixed(0)+'K';
  return'PKR '+val;
}

function statusColor(s){return s==='green'?'#3db87a':s==='red'?'#e05252':'#e8a020';}
 
function cardGrid(items){
  return items.map(c=>`<div style="background:#11131a;border:0.5px solid rgba(255,255,255,0.07);border-left:2px solid ${statusColor(c.status)};border-radius:8px;padding:10px;"><div style="font-size:10px;color:#888;margin-bottom:3px;">${c.metric}</div><div style="font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:${statusColor(c.status)};">${c.value}</div><div style="font-size:9px;color:#666;margin-top:2px;">${c.note}</div></div>`).join('');
}
 
function priceChartSVG(data,markers){
  if(!data||!data.length)return'';
  const w=320,h=110,pad=8;
  const mx=Math.max(...data),mn=Math.min(...data);
  const pts=data.map((v,i)=>{const x=pad+i*((w-2*pad)/(data.length-1));const y=h-pad-((v-mn)/(mx-mn||1))*(h-2*pad);return[x,y];});
  const line=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${pad},${h-pad} ${line} ${w-pad},${h-pad}`;
  const up=data[data.length-1]>=data[0];
  const col=up?'#3db87a':'#e05252';
  const markerDots=(markers||[]).map(m=>{const p=pts[m.i];if(!p)return'';return`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${col}" stroke="#08090d" stroke-width="1.5"/><text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" fill="#888" font-size="7" text-anchor="middle" font-family="monospace">${m.label}</text>`;}).join('');
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.25"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#ag)"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${markerDots}</svg>`;
}
 
function gaugeSVG(score){
  const angle=(score/100)*180;
  const r=70,cx=90,cy=90;
  const rad=(180-angle)*Math.PI/180;
  const x=cx+r*Math.cos(rad),y=cy-r*Math.sin(rad);
  const col=score>=66?'#3db87a':score>=40?'#e8a020':'#e05252';
  return`<svg viewBox="0 0 180 105" style="width:150px;height:auto;"><path d="M 20 90 A 70 70 0 0 1 160 90" fill="none" stroke="#1e2230" stroke-width="10" stroke-linecap="round"/><path d="M 20 90 A 70 70 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"/><text x="90" y="78" fill="${col}" font-size="26" font-weight="700" text-anchor="middle" font-family="monospace">${score}</text><text x="90" y="94" fill="#666" font-size="9" text-anchor="middle" font-family="monospace">RISK SCORE</text></svg>`;
}

function mktRow(s){return`<div class="mkt-row" onclick="showHolding('${s.ticker}')"><div class="mkt-left"><div class="mkt-icon">${s.ticker.slice(0,3)}</div><div><div class="mkt-ticker">${s.ticker}</div><div class="mkt-name">${s.name}</div></div></div><div class="mkt-right"><div class="mkt-price">${s.price}</div><div class="mkt-chg ${s.up?'up':'dn'}">${s.up?'▲':'▼'} ${s.pct}</div><div class="mkt-vol">VOL ${s.vol}</div></div></div>`;}
 
function filterBoard(el,f){
  document.querySelectorAll('.board-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  let list=PSX;
  if(f.includes('PSX'))list=PSX;
  else if(f.includes('US'))list=GLOBAL.filter(s=>s.country==='US');
  else if(f.includes('Europe'))list=GLOBAL.filter(s=>s.country==='EU');
  else if(f.includes('HK'))list=GLOBAL.filter(s=>s.country==='HK');
  else if(f.includes('Singapore'))list=GLOBAL.filter(s=>s.country==='SG');
  else if(f==='Gainers')list=[...PSX,...GLOBAL].filter(s=>s.up).sort((a,b)=>parseFloat(b.pct)-parseFloat(a.pct));
  else if(f==='Crypto')list=GLOBAL.filter(s=>s.sector==='crypto'||s.sector==='commodities');
  const c=document.getElementById('board-list');
  if(c)c.innerHTML=list.length>0?list.map(s=>mktRow(s)).join(''):`<div style="padding:28px;text-align:center;color:var(--muted);font-size:11px;" class="mono">NO STOCKS IN THIS BOARD.</div>`;
}
 
/* ── NEWS ── */
function buildNews(){
  const rel=NEWS.filter(n=>n.sectors.some(sec=>S.P.sectors.includes(sec)));
  S.news=rel.length>2?rel:NEWS;
  document.getElementById('sc-news').innerHTML=`
    <div style="padding:14px 16px 10px;border-bottom:0.5px solid var(--border);">
      <div style="font-size:18px;font-weight:600;">Market News</div>
      <div class="mono" style="font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.5px;">PSX & GLOBAL · TAILORED TO YOU</div>
    </div>
    <div class="news-list">${S.news.map(n=>nCard(n)).join('')}</div>`;
}
 
function nCard(n){
  const t=encodeURIComponent(n.title),su=encodeURIComponent(n.summary||'');
  return`<div class="ncard" onclick="openNews('${t}','${su}','${n.source}')"><div class="nbody"><div class="nsource">${n.source}</div><div class="ntitle">${n.title}</div><div class="nmeta">${n.sectors.map(s=>`<span class="ntag">${s.toUpperCase()}</span>`).join('')}${n.time}</div></div><div class="nthumb">${n.emoji}</div></div>`;
}
 
function openNews(t,su,source){
  const title=decodeURIComponent(t),summary=decodeURIComponent(su);
  goTab('chat');
  S.msgs.push({role:'assistant',isHTML:true,content:`<div class="news-summary-card"><div class="news-summary-source">${source}</div><div class="news-summary-title">${title}</div><div style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;">${summary}</div><button class="news-portfolio-btn" onclick="askImpact('${t}')">How will this affect my portfolio? →</button></div>`});
  renderMsgs();
}
 
function askImpact(t){const title=decodeURIComponent(t);const ta=document.getElementById('cin');if(ta)ta.value=`How will this news affect my portfolio: "${title}"? Reference my actual holdings.`;sendMsg();}
 
/* ── PROFILE ── */

    </div>
    <div class="prof-rows">
      <div class="prow"><div><div class="prow-lbl">Occupation</div><div class="prow-val">${p.occupation}</div></div></div>
      <div class="prow"><div><div class="prow-lbl">Investment Amount</div><div class="prow-val">${p.amount}</div></div></div>
      <div class="prow"><div><div class="prow-lbl">Risk Tolerance</div><div class="prow-val">${p.risk}/100 · ${RL(p.risk)}</div></div></div>
      <div class="prow"><div><div class="prow-lbl">Finance Level</div><div class="prow-val">${km[p.knowledge]||p.knowledge}</div></div></div>
    </div>
    <div class="prof-secs">
      <div class="prof-secs-lbl">YOUR SECTORS</div>
      <div class="prof-chips">${p.sectors.map(id=>{const s=SECTORS.find(s=>s.id===id);return s?`<div class="pchip">${s.emoji} ${s.name}</div>`:''}).join('')}</div>
    </div>`;

/* ── CHAT ── */
function sysprompt(){
  const p=S.P,km={none:'no prior finance knowledge',some:'some finance basics',expert:'expert-level knowledge'};
  const secs=p.sectors.map(id=>SECTORS.find(s=>s.id===id)?.name).filter(Boolean).join(', ');
  let pf='';
  if(S.portfolio)pf=`\n\nUSER'S CURRENT PORTFOLIO (${p.amount}): ${S.portfolio.holdings.map(h=>`${h.ticker} ${h.alloc}%`).join(', ')}. Strategy: ${S.portfolio.strategy}`;
  return`You are LuminFin, an elite AI investment advisor covering the Pakistan Stock Exchange (PSX), US, European, Hong Kong and Singapore markets. You think like a top-tier banker/portfolio manager.\n\nUSER: ${p.name}, age ${p.age}, ${p.occupation}, professional field: ${p.domain}, risk ${p.risk}/100 (${RL(p.risk)}), ${km[p.knowledge]}, investing ${p.amount}, sectors: ${secs}${pf}\n\nRULES: Address as ${p.name.split(' ')[0]}. Reference their actual portfolio holdings when relevant. Cover both Pakistani (KSE-100, SBP) and global markets depending on the question. Where sensible, lean toward stocks relevant to their professional field (${p.domain}). Match language to knowledge level. Never guarantee returns. Be direct, specific, and concise — max 200 words.`;
}
 
function initChat(){
  S.msgs=[{role:'assistant',isHTML:true,content:`Welcome, ${S.P.name.split(' ')[0]}! 👋<br><br>I'm your LuminFin advisor. I've built your portfolio based on your ${RL(S.P.risk).toLowerCase()} risk profile and ${S.P.amount} budget.<br><br>Ask me to adjust it, explain any holding, or analyze how news affects you.`}];
  renderMsgs();renderSugs();
}
 
function renderMsgs(){
  const av=ini(S.P.name),el=document.getElementById('msgs');if(!el)return;
  el.innerHTML=S.msgs.map(m=>`<div class="msg ${m.role}"><div class="mav">${m.role==='assistant'?'LF':av}</div><div class="mbub">${m.isHTML?m.content:fmt(m.content)}</div></div>`).join('')+(S.loading?`<div class="msg assistant"><div class="mav">LF</div><div class="typing"><span></span><span></span><span></span></div></div>`:'');
  el.scrollTop=el.scrollHeight;
}
function renderSugs(){const el=document.getElementById('sugs');if(!el)return;el.innerHTML=S.msgs.length>2?'':SUGS.map(s=>`<div class="sug" onclick="doSug('${s}')">${s}</div>`).join('');}
function hkey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function doSug(t){const ta=document.getElementById('cin');if(ta)ta.value=t;sendMsg();}
 
async function sendMsg(){
  if(S.loading)return;
  const ta=document.getElementById('cin'),txt=ta?ta.value.trim():'';
  if(!txt)return;if(ta){ta.value='';ta.style.height='auto';}
  S.msgs.push({role:'user',content:txt});S.loading=true;renderMsgs();renderSugs();
  try{
    const apiMsgs=S.msgs.filter(m=>!m.isHTML).map(m=>({role:m.role,content:m.content}));
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sysprompt(),messages:apiMsgs})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    const reply=d.content?.find(b=>b.type==='text')?.text||'Sorry, I had trouble responding.';
    S.msgs.push({role:'assistant',content:reply});
  }catch(e){S.msgs.push({role:'assistant',content:'Connection error — please try again.'});}
  S.loading=false;renderMsgs();renderSugs();
}
 
function closeModal(e){if(!e||e.target.classList.contains('modal-bg'))document.getElementById('modals').innerHTML='';}
 
/* ── AUTH (on-device accounts) ── */
let authMode='signup';
function renderAuth(){
  const c=document.getElementById('auth-card');
  if(authMode==='signup'){
    c.innerHTML=`
      <div class="ob-step">CREATE ACCOUNT</div>
      <div class="ob-title" style="margin-bottom:4px;">Get started</div>
      <div class="fgroup">
        <div class="field"><div class="flbl">Full name</div><input class="finput" id="au-name" type="text" placeholder="e.g. Ahmed Khan"/></div>
        <div class="field"><div class="flbl">Email</div><input class="finput" id="au-email" type="email" placeholder="you@example.com"/></div>
        <div class="field"><div class="flbl">Password</div><input class="finput" id="au-pass" type="password" placeholder="Create a password"/></div>
      </div>
      <div id="au-err" style="color:var(--danger);font-size:12px;display:none;"></div>
      <button class="ob-btn" onclick="doSignup()">Create Account →</button>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px;">Already have an account? <span style="color:var(--gold);cursor:pointer;" onclick="authMode='login';renderAuth()">Log in</span></div>`;
  }else{
    c.innerHTML=`
      <div class="ob-step">WELCOME BACK</div>
      <div class="ob-title" style="margin-bottom:4px;">Log in</div>
      <div class="fgroup">
        <div class="field"><div class="flbl">Email</div><input class="finput" id="au-email" type="email" placeholder="you@example.com"/></div>
        <div class="field"><div class="flbl">Password</div><input class="finput" id="au-pass" type="password" placeholder="Your password"/></div>
      </div>
      <div id="au-err" style="color:var(--danger);font-size:12px;display:none;"></div>
      <button class="ob-btn" onclick="doLogin()">Log In →</button>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px;">No account? <span style="color:var(--gold);cursor:pointer;" onclick="authMode='signup';renderAuth()">Sign up</span></div>`;
  }
}
 
function getUsers(){try{return JSON.parse(localStorage.getItem('lf_users')||'{}');}catch(e){return{};}}
function saveUsers(u){try{localStorage.setItem('lf_users',JSON.stringify(u));}catch(e){}}
function authErr(msg){const e=document.getElementById('au-err');if(e){e.textContent=msg;e.style.display='block';}}
 
function doSignup(){
  const name=document.getElementById('au-name')?.value.trim();
  const email=document.getElementById('au-email')?.value.trim().toLowerCase();
  const pass=document.getElementById('au-pass')?.value;
  if(!name||!email||!pass){authErr('Please fill in all fields.');return;}
  if(!email.includes('@')){authErr('Enter a valid email.');return;}
  if(pass.length<4){authErr('Password must be at least 4 characters.');return;}
  const users=getUsers();
  if(users[email]){authErr('An account with this email already exists.');return;}
  users[email]={name,pass};saveUsers(users);
  try{localStorage.setItem('lf_session',email);}catch(e){}
  S.P.name=name;S.P.email=email;
  startOnboarding();
}
 
function doLogin(){
  const email=document.getElementById('au-email')?.value.trim().toLowerCase();
  const pass=document.getElementById('au-pass')?.value;
  if(!email||!pass){authErr('Enter your email and password.');return;}
  const users=getUsers();
  if(!users[email]||users[email].pass!==pass){authErr('Incorrect email or password.');return;}
  try{localStorage.setItem('lf_session',email);}catch(e){}
  S.P.name=users[email].name;S.P.email=email;
  // Returning user with saved profile?
  let saved=null;try{saved=JSON.parse(localStorage.getItem('lf_profile_'+email)||'null');}catch(e){}
  if(saved&&saved.amount){S.P=saved;launch();}
  else startOnboarding();
}
 
function startOnboarding(){
  document.getElementById('auth').style.display='none';
  document.getElementById('ob').style.display='flex';
  S.step=0;renderOB();
}
 
// Save profile on launch
const _origLaunch=launch;
launch=function(){
  if(S.P.sectors.length===0)return;
  try{localStorage.setItem('lf_profile_'+S.P.email,JSON.stringify(S.P));}catch(e){}
  _origLaunch();
};
 
/* ── INIT ── */
(function init(){
  renderAuth();
  // Auto-login if session exists with a complete profile
  let sess=null;try{sess=localStorage.getItem('lf_session');}catch(e){}
  if(sess){
    const users=getUsers();
    if(users[sess]){
      let saved=null;try{saved=JSON.parse(localStorage.getItem('lf_profile_'+sess)||'null');}catch(e){}
      if(saved&&saved.amount){S.P=saved;document.getElementById('auth').style.display='none';launch();}
    }
}
})();
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
</script>
