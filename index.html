<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LuminFin</title>
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LuminFin">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c12;--bg2:#0f1118;--bg3:#161922;--bg4:#1e2230;
  --gold:#e8a020;--gold2:#f5c05a;--gold-dim:rgba(232,160,32,0.1);
  --text:#f0ece0;--text2:#9a9585;--muted:#555a6b;
  --border:rgba(255,255,255,0.07);--border2:rgba(232,160,32,0.25);
  --danger:#e05252;--success:#3db87a;
  --radius:10px;--radius-lg:16px;--radius-xl:20px;
  --card:#111420;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--text)}
#root{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--bg);position:relative}
 
/* ── ONBOARDING ── */
#ob{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-top)+40px) 24px calc(var(--safe-bottom)+24px);max-width:430px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
.ob-logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--text2);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 6px var(--gold)}50%{box-shadow:0 0 16px var(--gold),0 0 28px rgba(232,160,32,.3)}}
.ob-tag{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.6}
.ob-pbar{width:100%;margin-bottom:24px}
.ob-pbar-bg{height:2px;background:var(--bg4);border-radius:2px;position:relative;overflow:hidden}
.ob-pbar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:2px;transition:width .4s ease}
.ob-card{width:100%;background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-xl);padding:26px 22px;display:flex;flex-direction:column;gap:18px;flex:1;max-height:600px;overflow-y:auto}
.ob-card::-webkit-scrollbar{display:none}
.ob-step{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.ob-title{font-size:20px;font-weight:600;line-height:1.3}
.fgroup{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.flbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text2)}
.finput{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:12px 14px;outline:none;transition:border-color .2s}
.finput:focus{border-color:var(--gold)}.finput::placeholder{color:var(--muted)}
.risk-num{font-family:'Space Mono',monospace;font-size:36px;font-weight:700;color:var(--gold);text-align:center}
.risk-lbl{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--gold) var(--pct,50%),var(--bg4) var(--pct,50%));margin:14px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);cursor:pointer}
.slider-ends{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px}
.kopts{display:flex;flex-direction:column;gap:9px}
.kopt{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .2s,background .2s}
.kopt.sel{border-color:var(--gold);background:var(--gold-dim)}
.krad{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.kopt.sel .krad{border-color:var(--gold);background:var(--gold)}
.kopt.sel .krad::after{content:'';width:6px;height:6px;background:var(--bg);border-radius:50%;display:block}
.kt{font-size:13px;font-weight:500}.kd{font-size:11px;color:var(--text2);margin-top:2px}
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:border-color .2s,background .2s}
.sec-card.sel{border-color:var(--gold);background:var(--gold-dim)}
.sec-emo{font-size:20px;margin-bottom:5px}
.sec-name{font-size:12px;font-weight:600}
.sec-desc{font-size:10px;color:var(--text2);margin-top:2px}
.ob-btn{width:100%;background:var(--gold);color:#0a0c12;border:none;border-radius:var(--radius);padding:13px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:auto;letter-spacing:.2px}
.ob-btn:active{transform:scale(.98)}.ob-btn:disabled{opacity:.3;cursor:not-allowed}
 
/* ── APP ── */
#app{display:none;flex:1;flex-direction:column;height:100%;overflow:hidden}
.appbar{padding:calc(var(--safe-top)+12px) 18px 11px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0}
.appbar-logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;color:var(--gold);display:flex;align-items:center;gap:7px}
.appbar-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold);animation:glow 2s infinite}
.appbar-right{display:flex;align-items:center;gap:9px}
.live-tag{font-family:'Space Mono',monospace;font-size:9px;color:var(--success);border:0.5px solid var(--success);padding:3px 8px;border-radius:20px;letter-spacing:.5px;display:flex;align-items:center;gap:4px}
.live-dot{width:4px;height:4px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.av-btn{width:29px;height:29px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);cursor:pointer;flex-shrink:0}
#screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;padding-bottom:72px}
.screen.active{display:block}
.screen::-webkit-scrollbar{display:none}
.botnav{flex-shrink:0;display:flex;background:var(--bg2);border-top:0.5px solid var(--border);padding:7px 0 calc(7px + var(--safe-bottom))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:5px 0}
.nav-btn svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.nav-btn span{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.5px;transition:color .2s}
.nav-btn.active svg{stroke:var(--gold)}
.nav-btn.active span{color:var(--gold)}
 
/* SHARED */
.sh{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sec-more{font-size:11px;color:var(--muted);cursor:pointer}
.shimmer{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:6px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.up{color:var(--success)}.dn{color:var(--danger)}
 
/* HOME */
.home-hero{padding:18px;background:linear-gradient(160deg,var(--bg2),var(--bg));border-bottom:0.5px solid var(--border)}
.home-greet{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.home-name{font-size:22px;font-weight:600}
.home-secs{font-size:11px;color:var(--text2);margin-top:5px}
.stocks-row{display:flex;gap:11px;padding:4px 18px 14px;overflow-x:auto}
.stocks-row::-webkit-scrollbar{display:none}
.scard{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;min-width:132px;flex-shrink:0;cursor:pointer;transition:border-color .2s}
.scard:active{border-color:var(--border2)}
.scard-ticker{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.5px;margin-bottom:4px}
.scard-name{font-size:10px;color:var(--text2);margin-bottom:9px;line-height:1.4}
.mchart{height:28px;margin-bottom:7px}
.mchart svg{width:100%;height:100%}
.scard-price{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.scard-chg{font-family:'Space Mono',monospace;font-size:10px}
.ai-tag{display:inline-block;margin-top:7px;font-size:9px;font-family:'Space Mono',monospace;background:var(--gold-dim);color:var(--gold);padding:2px 7px;border-radius:20px;letter-spacing:.5px}
 
/* NEWS */
.news-list{display:flex;flex-direction:column}
.ncard{padding:14px 18px;border-bottom:0.5px solid var(--border);display:flex;gap:11px;cursor:pointer;transition:background .15s}
.ncard:active{background:var(--bg2)}
.nbody{flex:1}
.nsource{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.ntitle{font-size:13px;font-weight:500;line-height:1.5;margin-bottom:5px}
.nmeta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ntag{font-family:'Space Mono',monospace;font-size:9px;border:0.5px solid var(--border2);color:var(--text2);padding:2px 6px;border-radius:10px}
.nthumb{width:54px;height:54px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
 
/* MARKETS */
.mkt-tabs{display:flex;padding:12px 18px 0;gap:0;border-bottom:0.5px solid var(--border);overflow-x:auto}
.mkt-tabs::-webkit-scrollbar{display:none}
.mkt-tab{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;letter-spacing:.5px;white-space:nowrap}
.mkt-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.ai-banner{margin:14px 18px;background:var(--card);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:15px}
.ai-banner-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--gold);margin-bottom:9px}
.ai-banner-ticker{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;margin-bottom:3px}
.ai-banner-name{font-size:11px;color:var(--text2);margin-bottom:8px}
.ai-banner-reason{font-size:12px;color:var(--text2);line-height:1.6}
.mkt-list{display:flex;flex-direction:column}
.mkt-row{padding:12px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.mkt-row:active{background:var(--bg2)}
.mkt-left{display:flex;align-items:center;gap:11px}
.mkt-icon{width:35px;height:35px;border-radius:9px;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mkt-ticker{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.mkt-name{font-size:10px;color:var(--muted);margin-top:2px}
.mkt-right{text-align:right}
.mkt-price{font-family:'Space Mono',monospace;font-size:12px;font-weight:700}
.mkt-chg{font-family:'Space Mono',monospace;font-size:10px;margin-top:2px}
.country-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.country-box{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:22px 22px calc(22px + var(--safe-bottom));border-top:0.5px solid var(--border)}
.country-handle{width:32px;height:2px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.country-title{font-size:17px;font-weight:600;margin-bottom:5px}
.country-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.country-opt{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px;cursor:pointer;transition:border-color .2s,background .2s;text-align:center}
.country-opt:active{border-color:var(--gold);background:var(--gold-dim)}
.country-flag{font-size:22px;margin-bottom:5px}
.country-name{font-size:12px;font-weight:600}
.country-close{width:100%;background:transparent;border:0.5px solid var(--border);border-radius:var(--radius);padding:11px;font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);cursor:pointer}
 
/* CHAT */
.chat-shell{display:flex;flex-direction:column;height:100%}
.chat-top{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg)}
.chat-av{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--gold);flex-shrink:0}
.chat-name{font-size:13px;font-weight:600}
.chat-status{font-family:'Space Mono',monospace;font-size:9px;color:var(--success);display:flex;align-items:center;gap:4px;margin-top:2px;letter-spacing:.5px}
.chat-sdot{width:4px;height:4px;border-radius:50%;background:var(--success)}
.msgs{flex:1;overflow-y:auto;padding:13px 14px;display:flex;flex-direction:column;gap:11px}
.msgs::-webkit-scrollbar{display:none}
.msg{display:flex;gap:7px}.msg.user{flex-direction:row-reverse}
.mbub{max-width:82%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.65}
.msg.assistant .mbub{background:var(--card);border:0.5px solid var(--border);border-bottom-left-radius:3px}
.msg.user .mbub{background:var(--gold);color:#0a0c12;border-bottom-right-radius:3px;font-weight:500}
.mav{width:25px;height:25px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Space Mono',monospace;margin-top:2px}
.msg.assistant .mav{background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2)}
.msg.user .mav{background:var(--bg3);color:var(--text);border:0.5px solid var(--border)}
.typing{display:flex;align-items:center;gap:4px;padding:10px 13px;background:var(--card);border:0.5px solid var(--border);border-radius:15px;border-bottom-left-radius:3px;width:fit-content}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite;opacity:.4}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.sugs{padding:7px 13px;display:flex;gap:7px;overflow-x:auto;flex-shrink:0}
.sugs::-webkit-scrollbar{display:none}
.sug{background:var(--bg3);border:0.5px solid var(--border);border-radius:20px;padding:6px 11px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .2s}
.sug:active{border-color:var(--gold);color:var(--gold)}
.chat-in-row{padding:9px 13px calc(9px + var(--safe-bottom));display:flex;gap:8px;align-items:flex-end;border-top:0.5px solid var(--border);background:var(--bg);flex-shrink:0}
.cin{flex:1;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:none;max-height:86px;line-height:1.5;transition:border-color .2s}
.cin:focus{border-color:var(--gold)}.cin::placeholder{color:var(--muted)}
.sendbtn{width:36px;height:36px;border-radius:9px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s,transform .1s}
.sendbtn:active{transform:scale(.92)}.sendbtn:disabled{opacity:.3;cursor:not-allowed}
.sendbtn svg{width:13px;height:13px}
 
/* NEWS SUMMARY in chat */
.news-summary-card{background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.news-summary-source{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1px;margin-bottom:5px}
.news-summary-title{font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.4}
.news-portfolio-btn{width:100%;background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2);border-radius:8px;padding:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s;letter-spacing:.2px}
.news-portfolio-btn:active{background:rgba(232,160,32,0.2)}
 
/* PROFILE */
.prof-hero{padding:24px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:11px;border-bottom:0.5px solid var(--border)}
.prof-av{width:68px;height:68px;border-radius:50%;background:var(--gold-dim);border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:20px;color:var(--gold)}
.prof-name{font-size:20px;font-weight:600}
.prof-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.ptag{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);border:0.5px solid var(--border2);padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.prof-rows{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.prow{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.prow-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:3px}
.prow-val{font-size:13px;font-weight:500}
.prof-secs{padding:0 18px 18px}
.prof-secs-lbl{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1.5px;margin-bottom:9px}
.prof-chips{display:flex;flex-wrap:wrap;gap:7px}
.pchip{font-size:12px;background:var(--gold-dim);color:var(--gold);border:0.5px solid var(--border2);padding:4px 11px;border-radius:20px}
</style>
</head>
<body>
<div id="root">
 
<!-- ═══ ONBOARDING ═══ -->
<div id="ob">
  <div class="ob-logo"><span class="ob-dot"></span>LUMINFIN</div>
  <div class="ob-tag">Your personal AI finance consultant<br>— tailored to you.</div>
  <div class="ob-pbar"><div class="ob-pbar-bg"><div class="ob-pbar-fill" id="ob-fill" style="width:20%"></div></div></div>
  <div class="ob-card" id="ob-card"></div>
</div>
 
<!-- ═══ MAIN APP ═══ -->
<div id="app">
  <div class="appbar">
    <div class="appbar-logo"><span class="appbar-dot"></span>LUMINFIN</div>
    <div class="appbar-right">
      <div class="live-tag"><span class="live-dot"></span>LIVE</div>
      <div class="av-btn" id="av-btn" onclick="goTab('profile')"></div>
    </div>
  </div>
  <div id="screens">
    <div class="screen active" id="sc-home"></div>
    <div class="screen" id="sc-markets"></div>
    <div class="screen" id="sc-news"></div>
    <div class="screen" id="sc-chat">
      <div class="chat-shell" style="height:100%">
        <div class="chat-top">
          <div class="chat-av">LF</div>
          <div><div class="chat-name">LuminFin Advisor</div><div class="chat-status"><span class="chat-sdot"></span>ONLINE</div></div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="sugs" id="sugs"></div>
        <div class="chat-in-row">
          <textarea class="cin" id="cin" placeholder="Ask about markets, stocks, strategy…" rows="1" onkeydown="hkey(event)"></textarea>
          <button class="sendbtn" id="sbtn" onclick="sendMsg()">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0a0c12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>

const SUGS=['What stocks suit my profile?','Is now a good time to invest?','Explain ETFs simply','How do I hedge against inflation?'];
const RL=v=>v<20?'Capital Preservation':v<40?'Conservative':v<60?'Balanced':v<80?'Growth':'Aggressive';
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'U';
const fmt=t=>t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/^[•\-] /gm,'&bull; ').replace(/\n/g,'<br>');
 
/* ── ONBOARDING ── */
const STEPS=['Tell us about yourself','Your occupation','Your risk appetite','Finance knowledge','Pick your interests'];
 
function renderOB(){
  document.getElementById('ob-fill').style.width=((S.step+1)/5*100)+'%';
  document.getElementById('ob-card').innerHTML=`
    <div class="ob-step">STEP ${S.step+1} OF 5</div>
    <div class="ob-title">${STEPS[S.step]}</div>
    ${[s0,s1,s2,s3,s4][S.step]()}`;
  if(S.step===2){const r=document.getElementById('fr');if(r)r.addEventListener('input',function(){const v=parseInt(this.value);S.P.risk=v;this.style.setProperty('--pct',v+'%');const d=document.getElementById('rv'),l=document.getElementById('rl');if(d)d.textContent=v;if(l)l.textContent=RL(v);});}
}
 
function s0(){return`<div class="fgroup"><div class="field"><div class="flbl">Your name</div><input class="finput" id="fn" type="text" placeholder="e.g. Ahmed Khan" value="${S.P.name}"/></div><div class="field"><div class="flbl">Your age</div><input class="finput" id="fa" type="number" placeholder="e.g. 25" min="13" max="100" value="${S.P.age}"/></div></div><button class="ob-btn" onclick="obNext()">Continue →</button>`;}
function s1(){return`<div class="field"><div class="flbl">Occupation</div><input class="finput" id="fo" type="text" placeholder="e.g. Engineer, Student, Business Owner" value="${S.P.occupation}"/></div><button class="ob-btn" onclick="obNext()">Continue →</button>`;}
function s2(){return`<div style="text-align:center;padding:6px 0"><div class="risk-num" id="rv">${S.P.risk}</div><div class="risk-lbl" id="rl">${RL(S.P.risk)}</div></div><input type="range" id="fr" min="0" max="100" step="1" value="${S.P.risk}" style="--pct:${S.P.risk}%"/><div class="slider-ends"><span>SAFE</span><span>AGGRESSIVE</span></div><button class="ob-btn" onclick="obNext()">Continue →</button>`;}
function s3(){return`<div class="kopts">${KO.map(k=>`<div class="kopt ${S.P.knowledge===k.id?'sel':''}" onclick="selK('${k.id}')"><div class="krad"></div><div><div class="kt">${k.title}</div><div class="kd">${k.desc}</div></div></div>`).join('')}</div><button class="ob-btn" id="kbtn" onclick="obNext()" ${!S.P.knowledge?'disabled':''}>Continue →</button>`;}
function s4(){return`<div class="sec-grid" style="overflow-y:auto;flex:1;">${SECTORS.map(s=>`<div class="sec-card ${S.P.sectors.includes(s.id)?'sel':''}" onclick="toggleSec('${s.id}')"><div class="sec-emo">${s.emoji}</div><div class="sec-name">${s.name}</div><div class="sec-desc">${s.desc}</div></div>`).join('')}</div><button class="ob-btn" id="lbtn" onclick="launch()" ${S.P.sectors.length===0?'disabled':''}>Launch My App →</button>`;}
 
function obNext(){
  if(S.step===0){const n=document.getElementById('fn')?.value.trim(),a=document.getElementById('fa')?.value.trim();if(!n||!a||isNaN(a)||a<13)return;S.P.name=n;S.P.age=a;}
  else if(S.step===1){const o=document.getElementById('fo')?.value.trim();if(!o)return;S.P.occupation=o;}
  else if(S.step===2){S.P.risk=parseInt(document.getElementById('fr')?.value||50);}
  else if(S.step===3){if(!S.P.knowledge)return;}
  S.step++;renderOB();
}
function selK(id){S.P.knowledge=id;document.querySelectorAll('.kopt').forEach(el=>el.classList.toggle('sel',el.getAttribute('onclick').includes(`'${id}'`)));const b=document.getElementById('kbtn');if(b)b.disabled=false;}
function toggleSec(id){const i=S.P.sectors.indexOf(id);if(i>-1)S.P.sectors.splice(i,1);else S.P.sectors.push(id);document.querySelectorAll('.sec-card').forEach(el=>el.classList.toggle('sel',el.getAttribute('onclick').includes(`'${id}'`)&&S.P.sectors.includes(id)));const b=document.getElementById('lbtn');if(b)b.disabled=S.P.sectors.length===0;}
 
function launch(){
  if(S.P.sectors.length===0)return;
  document.getElementById('ob').style.display='none';
  const a=document.getElementById('app');a.style.display='flex';a.style.flexDirection='column';a.style.flex='1';
  document.getElementById('av-btn').textContent=ini(S.P.name);
  buildHome();buildProfile();loadStocks();loadNews();initChat();
}
 
/* ── TABS ── */
function goTab(tab){
  S.tab=tab;

  document.getElementById(`sc-${tab}`).classList.add('active');
  const idx=['home','markets','news','chat'].indexOf(tab);
  if(idx>-1)document.querySelectorAll('.nav-btn')[idx].classList.add('active');
}
 
/* ── HOME ── */
function buildHome(){
  const secs=S.P.sectors.map(id=>SECTORS.find(s=>s.id===id)?.name).filter(Boolean).slice(0,3).join(', ');

    <div class="home-hero">
      <div class="home-greet">GOOD DAY,</div>
      <div class="home-name">${S.P.name.split(' ')[0]} 👋</div>

    <div id="home-news"><div style="padding:18px;text-align:center;color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;">LOADING NEWS…</div></div>`;
}
 
/* ── STOCKS ── */
function miniSVG(up){
  const pts=Array.from({length:8},(_,i)=>i===7?100:Math.random()*40+(up?40:20));
  const mx=Math.max(...pts),mn=Math.min(...pts);
  const norm=pts.map(p=>((p-mn)/(mx-mn||1))*24);
  const coords=norm.map((y,i)=>`${i*(100/7)},${24-y}`).join(' ');
  const c=up?'#3db87a':'#e05252';
  return`<svg viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="${coords}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
 
function loadStocks(){
  const rel=STOCK_DATA.filter(s=>s.sectors.some(sec=>S.P.sectors.includes(sec)));
  S.stocks=rel.length>0?rel:STOCK_DATA.slice(0,8);
  const hs=document.getElementById('home-stocks');
  if(hs)hs.innerHTML=S.stocks.slice(0,5).map(s=>`
    <div class="scard" onclick="showStock('${s.ticker}')">
      <div class="scard-ticker">${s.ticker}</div>
      <div class="scard-name">${s.name}</div>
      <div class="mchart">${miniSVG(s.up)}</div>
      <div class="scard-price">$${s.price}</div>
      <div class="scard-chg ${s.up?'up':'dn'}">${s.up?'▲':'▼'} ${s.pct}</div>
      <div class="ai-tag">AI PICK</div>
    </div>`).join('');
  genAIPick(S.stocks[0]);
  buildMarkets(S.stocks);
}
 
async function genAIPick(stock){
  if(!stock)return;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      system:`You are a concise stock analyst. ONE sentence max 20 words: why ${stock.ticker} suits a ${S.P.age}-year-old with ${S.P.risk}/100 risk interested in ${S.P.sectors.join(', ')}.`,
      messages:[{role:'user',content:`Why ${stock.ticker}?`}]
    })});
    const d=await res.json();
    S.aiPick={...stock,reason:d.content?.find(b=>b.type==='text')?.text||'Strong fundamentals match your risk profile.'};
    const b=document.getElementById('ai-banner-inner');if(b)b.innerHTML=bannerHTML();
  }catch(e){console.log('AI pick error:',e);}
}
 
function bannerHTML(){
  if(!S.aiPick)return`<div class="shimmer" style="height:80px;"></div>`;
  return`<div class="ai-banner-lbl">⚡ AI TOP PICK FOR YOU</div>
    <div class="ai-banner-ticker">${S.aiPick.emoji} ${S.aiPick.ticker}</div>
    <div class="ai-banner-name">${S.aiPick.name}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <span style="font-family:'Space Mono',monospace;font-size:13px;">$${S.aiPick.price}</span>
      <span class="${S.aiPick.up?'up':'dn'}" style="font-family:'Space Mono',monospace;font-size:10px;">${S.aiPick.up?'▲':'▼'} ${S.aiPick.pct}</span>
    </div>
    <div class="ai-banner-reason">${S.aiPick.reason}</div>`;
}
 
function buildMarkets(stocks){
  const tabs=['All','Tech','Crypto','Energy','Finance','Stocks'];
  document.getElementById('sc-markets').innerHTML=`
    <div class="mkt-tabs">${tabs.map((t,i)=>`<div class="mkt-tab ${i===0?'active':''}" onclick="filterMkt(this,'${t}')">${t}</div>`).join('')}</div>
    <div class="ai-banner"><div id="ai-banner-inner">${bannerHTML()}</div></div>
    <div class="sec-hdr"><span class="sh">All Markets</span></div>
    <div class="mkt-list" id="mkt-list">${stocks.map(s=>mktRow(s)).join('')}</div>`;

function mktRow(s){return`<div class="mkt-row" onclick="showStock('${s.ticker}')"><div class="mkt-left"><div class="mkt-icon">${s.emoji}</div><div><div class="mkt-ticker">${s.ticker}</div><div class="mkt-name">${s.name}${s.country&&s.country!=='GLOBAL'?' · '+s.country:''}</div></div></div><div class="mkt-right"><div class="mkt-price">$${s.price}</div><div class="mkt-chg ${s.up?'up':'dn'}">${s.up?'▲':'▼'} ${s.pct}</div></div></div>`;}
 
function filterMkt(el,f){
  document.querySelectorAll('.mkt-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  if(f==='Stocks'){showCountryPicker();return;}
  const map={'All':null,'Tech':'tech','Crypto':'crypto','Energy':'energy','Finance':'finance'};
  const sec=map[f];
  const filtered=sec?STOCK_DATA.filter(s=>s.sectors.includes(sec)):STOCK_DATA;
  const list=document.getElementById('mkt-list');
  if(list)list.innerHTML=filtered.length>0?filtered.map(s=>mktRow(s)).join(''):`<div style="padding:28px;text-align:center;color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;">NO STOCKS IN THIS CATEGORY.</div>`;
}
 
function showCountryPicker(){
  document.getElementById('modals').innerHTML=`
    <div class="country-modal" onclick="closeCountry(event)">

        <div class="country-title">Select a country</div>

          </div>`).join('')}

        <button class="country-close" onclick="closeCountry()">Show All Stocks</button>
      </div>
    </div>`;
}
 
function filterByCountry(code){
  closeCountry();
  const filtered=STOCK_DATA.filter(s=>s.country===code||s.country==='GLOBAL');
  const list=document.getElementById('mkt-list');
  if(list)list.innerHTML=filtered.length>0?filtered.map(s=>mktRow(s)).join(''):`<div style="padding:28px;text-align:center;color:var(--muted);font-size:11px;font-family:'Space Mono',monospace;">NO STOCKS FOUND FOR THIS COUNTRY.</div>`;
}
 
function closeCountry(e){if(!e||e.target.classList.contains('country-modal'))document.getElementById('modals').innerHTML='';}
 
function showStock(ticker){
  const s=STOCK_DATA.find(s=>s.ticker===ticker);if(!s)return;
  document.getElementById('modals').innerHTML=`
    <div class="country-modal" onclick="closeModal(event)">
      <div class="country-box" onclick="event.stopPropagation()">
        <div class="country-handle"></div>
        <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px;">
          <div style="width:44px;height:44px;border-radius:10px;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;">${s.emoji}</div>
          <div><div style="font-size:16px;font-weight:600;">${s.name}</div><div style="font-family:'Space Mono',monospace;font-size:10px;color:var(--gold);margin-top:2px;letter-spacing:.5px;">${s.ticker}</div></div>
        </div>
        <div style="display:flex;gap:18px;margin-bottom:16px;">
          <div><div style="font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:3px;">PRICE</div><div style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700;">$${s.price}</div></div>
          <div><div style="font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:3px;">CHANGE</div><div style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:${s.up?'var(--success)':'var(--danger)'};">${s.up?'+':''}${s.chg}</div></div>
        </div>
        <div style="height:52px;margin-bottom:16px;">${miniSVG(s.up)}</div>
        <button class="ob-btn" style="margin-top:0;" onclick="askStock('${s.ticker}');closeModal()">Ask Advisor about ${s.ticker} →</button>
      </div>
    </div>`;
}
 
function askStock(t){goTab('chat');const ta=document.getElementById('cin');if(ta)ta.value=`Tell me about ${t} and whether it suits my profile.`;setTimeout(()=>sendMsg(),300);}
 
/* ── NEWS ── */
function loadNews(){
  const rel=NEWS.filter(n=>n.sectors.some(sec=>S.P.sectors.includes(sec)));
  S.news=rel.length>2?rel:NEWS;
  document.getElementById('sc-news').innerHTML=`
    <div style="padding:14px 18px 10px;border-bottom:0.5px solid var(--border);">
      <div style="font-size:18px;font-weight:600;">Financial News</div>
      <div style="font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.5px;">TAILORED TO YOUR INTERESTS</div>
    </div>
    <div class="news-list">${S.news.map(n=>nCard(n)).join('')}</div>`;
  const hn=document.getElementById('home-news');
  if(hn)hn.innerHTML=`<div class="news-list">${S.news.slice(0,3).map(n=>nCard(n)).join('')}</div>`;
}
 
function nCard(n){
  // Encode title and summary safely
  const safeTitle=encodeURIComponent(n.title);
  const safeSummary=encodeURIComponent(n.summary||'');
  return`<div class="ncard" onclick="openNews('${safeTitle}','${safeSummary}','${n.source}')">
    <div class="nbody">
      <div class="nsource">${n.source}</div>
      <div class="ntitle">${n.title}</div>
      <div class="nmeta">${n.sectors.map(s=>`<span class="ntag">${s.toUpperCase()}</span>`).join('')}${n.time}</div>
    </div>
    <div class="nthumb">${n.emoji}</div>
  </div>`;
}
 
function openNews(encTitle, encSummary, source){
  const title=decodeURIComponent(encTitle);
  const summary=decodeURIComponent(encSummary);
  goTab('chat');
  // Inject a news card message into the chat
  S.msgs.push({
    role:'assistant',
    content:`<div class="news-summary-card"><div class="news-summary-source">${source}</div><div class="news-summary-title">${title}</div><div style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;">${summary}</div><button class="news-portfolio-btn" onclick="askPortfolioImpact('${encTitle}')">How will this affect my portfolio? →</button></div>`,
    isHTML:true
  });
  renderMsgs();
}
 
function askPortfolioImpact(encTitle){
  const title=decodeURIComponent(encTitle);
  const ta=document.getElementById('cin');
  if(ta)ta.value=`How will this news affect my portfolio: "${title}"?`;
  sendMsg();
}
 
/* ── PROFILE ── */
function buildProfile(){
  const p=S.P,km={none:'Beginner',some:'Intermediate',expert:'Expert'};
  document.getElementById('sc-profile').innerHTML=`
    <div class="prof-hero">
      <div class="prof-av">${ini(p.name)}</div>
      <div class="prof-name">${p.name}</div>
      <div class="prof-tags"><span class="ptag">AGE ${p.age}</span><span class="ptag">RISK ${p.risk}</span><span class="ptag">${km[p.knowledge]||p.knowledge}</span></div>
    </div>
    <div class="prof-rows">
      <div class="prow"><div><div class="prow-lbl">Occupation</div><div class="prow-val">${p.occupation}</div></div></div>
      <div class="prow"><div><div class="prow-lbl">Risk Tolerance</div><div class="prow-val">${p.risk}/100 · ${RL(p.risk)}</div></div></div>
      <div class="prow"><div><div class="prow-lbl">Finance Level</div><div class="prow-val">${km[p.knowledge]||p.knowledge}</div></div></div>
    </div>
    <div class="prof-secs">
      <div class="prof-secs-lbl">YOUR SECTORS</div>
      <div class="prof-chips">${p.sectors.map(id=>{const s=SECTORS.find(s=>s.id===id);return s?`<div class="pchip">${s.emoji} ${s.name}</div>`:''}).join('')}</div>
    </div>`;
}
 
/* ── CHAT ── */
function sysprompt(){
  const p=S.P,km={none:'no prior finance knowledge',some:'some finance basics',expert:'expert-level knowledge including derivatives'};
  const secs=p.sectors.map(id=>SECTORS.find(s=>s.id===id)?.name).filter(Boolean).join(', ');
  return`You are LuminFin, an elite AI personal finance advisor. Expert in global markets, Pakistani context (PKR, PSX), and international investing.\n\nUSER: ${p.name}, age ${p.age}, ${p.occupation}, risk ${p.risk}/100 (${RL(p.risk)}), ${km[p.knowledge]}, interested in: ${secs}\n\nRULES: Address as ${p.name.split(' ')[0]}. Tailor advice to profile. Match language to knowledge level. Include Pakistani context where relevant. Never guarantee returns. Be direct and concise — max 200 words.`;
}
 
function initChat(){
  S.msgs=[{role:'assistant',content:`Welcome, ${S.P.name.split(' ')[0]}! 👋<br><br>I'm your LuminFin advisor — calibrated to your profile, tracking <strong>${S.P.sectors.slice(0,3).map(id=>SECTORS.find(s=>s.id===id)?.name).filter(Boolean).join(', ')}</strong>.<br><br>Tap a news story or stock to get instant analysis, or ask me anything below.`,isHTML:true}];
  renderMsgs();renderSugs();
}
 
function renderMsgs(){
  const av=ini(S.P.name),el=document.getElementById('msgs');if(!el)return;
  el.innerHTML=S.msgs.map(m=>`<div class="msg ${m.role}"><div class="mav">${m.role==='assistant'?'LF':av}</div><div class="mbub">${m.isHTML?m.content:fmt(m.content)}</div></div>`).join('')+(S.loading?`<div class="msg assistant"><div class="mav">LF</div><div class="typing"><span></span><span></span><span></span></div></div>`:'');
  el.scrollTop=el.scrollHeight;
}
 
function renderSugs(){
  const el=document.getElementById('sugs');if(!el)return;
  el.innerHTML=S.msgs.length>2?'':SUGS.map(s=>`<div class="sug" onclick="doSug('${s}')">${s}</div>`).join('');
}
 
function hkey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function doSug(t){const ta=document.getElementById('cin');if(ta)ta.value=t;sendMsg();}
 
async function sendMsg(){
  if(S.loading)return;
  const ta=document.getElementById('cin'),txt=ta?ta.value.trim():'';
  if(!txt)return;if(ta){ta.value='';ta.style.height='auto';}
  S.msgs.push({role:'user',content:txt});S.loading=true;renderMsgs();renderSugs();
  try{
    // Only send text messages to API (not HTML cards)
    const apiMsgs=S.msgs.filter(m=>!m.isHTML).map(m=>({role:m.role,content:m.content}));
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sysprompt(),messages:apiMsgs})});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const d=await res.json();
    const reply=d.content?.find(b=>b.type==='text')?.text||'Sorry, I had trouble responding.';
    S.msgs.push({role:'assistant',content:reply});
  }catch(e){S.msgs.push({role:'assistant',content:'Connection error — please check the app is deployed correctly and try again.'});}
  S.loading=false;renderMsgs();renderSugs();
}
 
function closeModal(e){if(!e||e.target.classList.contains('country-modal'))document.getElementById('modals').innerHTML='';}
 
/* ── INIT ── */
renderOB();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
